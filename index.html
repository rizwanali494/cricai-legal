<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CricFellow Legal</title>
<style>
  :root { --bg:#ffffff; --text:#14181f; --muted:#5b6472; --line:#e4e7ec; --accent:#00a854; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#07090c; --text:#f5f7fa; --muted:#8a93a0; --line:#1c2129; --accent:#00e676; } }
  :root[data-theme="dark"] { --bg:#07090c; --text:#f5f7fa; --muted:#8a93a0; --line:#1c2129; --accent:#00e676; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:48px 16px; }
  .brand { color:var(--accent); font-weight:800; font-size:28px; }
  a { display:block; padding:16px 0; border-bottom:1px solid var(--line); color:var(--text); text-decoration:none; font-weight:600; }
  a span { color:var(--muted); font-weight:400; display:block; font-size:14px; }
</style>
</head>
<body>
<main>
  <div class="brand">CricFellow</div>
  <p>Legal information for the CricFellow app.</p>
  <a href="terms.html">Terms and Conditions<span>The rules for using CricFellow</span></a>
  <a href="privacy.html">Privacy Policy<span>What we collect, who sees it, and how to delete it</span></a>
</main>
</body>
</html>
